actors:
  - id: agent-a
    token_env: AGENT_A_TOKEN
    data:
      sensitive_access: true
    network:
      allowed: true
      private_ip_origins: [http://publisher:8003]
      publication: true
      services:
        - origin: http://publisher:8003
          mode: publication
          egress: external
          paths: [/publish]
    filesystem:
      scopes:
        session: {read: true, write: true}
        actor: {read: true, write: true}
        shared: {read: true, write: true, channels: [approved]}
      protected: []
    tools: {shell: false, external_api: false}
    persistence: {session: true, cross_session: false}
    shared_channels: [approved]
  - id: agent-b
    token_env: AGENT_B_TOKEN
    data:
      sensitive_access: false
    network:
      allowed: true
      private_ip_origins: [http://publisher:8003]
      publication: true
      services:
        - origin: http://publisher:8003
          mode: publication
          egress: external
          paths: [/publish]
    filesystem:
      scopes:
        session: {read: true, write: true}
        actor: {read: true, write: true}
        shared: {read: true, write: true, channels: [approved]}
      protected: []
    tools: {shell: false, external_api: false}
    persistence: {session: true, cross_session: false}
    shared_channels: [approved]
operator_token_env: GOV_SUBSTRATE_OPERATOR_TOKEN
