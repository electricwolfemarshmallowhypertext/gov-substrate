services:
  publisher:
    image: python:3.12-slim
    command: python /srv/publication_server.py
    read_only: true
    user: "65534:65534"
    tmpfs:
      - /tmp:size=16m
    volumes:
      - type: bind
        source: ./tests/fixtures/publication_server.py
        target: /srv/publication_server.py
        read_only: true
    networks: [egress]

  substrate:
    environment:
      AGENT_A_TOKEN: lab-agent-a-token
      AGENT_B_TOKEN: lab-agent-b-token

  agent:
    environment:
      RESEARCH_AGENT_TOKEN: lab-agent-a-token
