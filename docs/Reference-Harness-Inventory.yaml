# Reference Docker generation worker. The environment acceptance test compares
# this declaration with Docker inspect and actual attempts inside the worker.
# "blocked" means the forbidden outcome did not occur; a readable sanitized
# /proc/self/environ is acceptable when it contains no unexpected names.
schema: 1
backend: Docker/OCI
worker:
  image_definition: Dockerfile.generation
  entrypoint: /app/local_generation_worker.py
  uid_gid: '65534:65534'
  network: none
  root_filesystem: read_only
  linux_capabilities: []
  privileged: false
  process_limit: 32
  mounts:
    - target: /model/model.gguf
      access: read_only
  writable:
    - /tmp
    - /dev/shm
  process_environment:
    - PATH
    - HOME
    - PYTHONDONTWRITEBYTECODE
    - OMP_NUM_THREADS
    - OPENBLAS_NUM_THREADS
    - LC_CTYPE
  input: sealed_governed_context_on_stdin
  output: completion_to_trusted_adapter_on_stdout
  substrate_socket: absent
  provider_credentials: absent
  workspace_mount: absent
  prior_worker_storage: absent
  external_spend: none
substrate:
  callable_by_agent: [/sessions, /proposals, /authorizations, /executions, /health]
  operator_only: [/tasks/issue, /audit, /overrides, /objects/import,
                  /objects/declassify, /provider-transfers/approve]
  trusted_adapter_only: [/generations/claim, /generations/complete]
  gateway_credential_required: [/generations/provider-call]
  host_operator_method: set_circuit
  shared_communication: named_state_or_filesystem_channels_only
  provider_spend: registered_provider_and_classification_grant_required
  hard_currency_cap: absent
probes:
  allowed:
    - model_read
    - private_tmp
    - private_shm
    - ipc_namespace
    - mount_namespace
  blocked:
    - direct_ipv4
    - direct_ipv6
    - dns_public
    - dns_other_container
    - docker_gateway
    - host_docker_internal
    - cloud_metadata_ipv4
    - cloud_metadata_ipv6
    - other_container
    - loopback_ipv4:80
    - loopback_ipv4:2375
    - loopback_ipv4:8000
    - loopback_ipv4:8001
    - loopback_ipv4:8002
    - loopback_ipv4:8080
    - loopback_ipv6
    - unix_socket:/var/run/docker.sock
    - unix_socket:/run/docker.sock
    - unix_socket:/run/containerd/containerd.sock
    - unix_socket:/ipc/substrate.sock
    - unix_socket:/tmp/agent.sock
    - unexpected_mount:/workspace
    - unexpected_mount:/ipc
    - unexpected_mount:/run/secrets
    - unexpected_mount:/host
    - unexpected_mount:/mnt/c
    - unexpected_mount:/mnt/e
    - unexpected_mount:/run/desktop/mnt/host
    - host_or_workspace_file:/workspace/{marker}
    - host_or_workspace_file:/host/{marker}
    - host_or_workspace_file:/mnt/e/gov-substrate/{marker}
    - host_or_workspace_file:/run/desktop/mnt/host/e/gov-substrate/{marker}
    - model_write_descriptor
    - model_mount_directory_write
    - environment_secrets
    - proc_self_environ
    - proc_pid1_environ
    - unrelated_host_pid
    - unrelated_processes
