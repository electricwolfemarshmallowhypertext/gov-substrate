[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-substrate"
version = "0.2.0"
description = "A small, auditable execution boundary for stateful agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "PyYAML>=6,<7", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
llm = ["anthropic>=0.50,<1"]

[tool.setuptools]
py-modules = ["substrate", "network_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
