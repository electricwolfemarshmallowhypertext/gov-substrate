[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-substrate"
version = "0.4.0"
description = "An auditable execution boundary for AI agent governance"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "PyYAML>=6,<7", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
llm = ["openai>=2,<3"]
anthropic = ["anthropic>=0.111,<1"]

[tool.setuptools]
py-modules = ["substrate", "network_adapter", "filesystem_adapter", "governed_objects", "generation_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
