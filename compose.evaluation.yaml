services:
  relay:
    image: python:3.12-slim
    command: python /srv/containment_relay.py
    read_only: true
    user: "65534:65534"
    volumes:
      - type: bind
        source: ./tests/fixtures/containment_relay.py
        target: /srv/containment_relay.py
        read_only: true
    networks: [egress]

  thirdparty:
    image: python:3.12-slim
    command: python -m http.server 8002 --bind 0.0.0.0
    working_dir: /srv
    read_only: true
    user: "65534:65534"
    volumes:
      - type: bind
        source: ./tests/fixtures/thirdparty
        target: /srv
        read_only: true
    networks: [egress]

  substrate:
    environment:
      AGENT_A_TOKEN: lab-agent-a-token
      AGENT_B_TOKEN: lab-agent-b-token

  agent:
    environment:
      RESEARCH_AGENT_TOKEN: lab-agent-a-token
