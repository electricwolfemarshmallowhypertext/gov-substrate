actors:
  - id: research-agent-01
    token_env: RESEARCH_AGENT_TOKEN
    network:
      allowed: false
      services: []
    filesystem:
      scopes:
        session: {read: true, write: true}
        actor: {read: false, write: false}
        shared: {read: false, write: false, channels: []}
      protected: []
    tools:
      shell: true
      external_api: false
    persistence:
      session: true
      cross_session: false
    shared_channels: []
operator_token_env: GOV_SUBSTRATE_OPERATOR_TOKEN
