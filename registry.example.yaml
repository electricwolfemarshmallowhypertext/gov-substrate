actors:
  - id: research-agent-01
    token_env: RESEARCH_AGENT_TOKEN
    network:
      allowed: false
      services: []
    filesystem:
      scopes:
        session: {read: true, write: true}
        actor: {read: false, write: false}
        shared: {read: false, write: false, channels: []}
      protected: []
    tools:
      shell: true
      external_api: false
    persistence:
      session: true
      cross_session: false
    shared_channels: []
operator_token_env: GOV_SUBSTRATE_OPERATOR_TOKEN
circuit_operator_token_env: GOV_SUBSTRATE_CIRCUIT_OPERATOR_TOKEN
# Hosted generation defaults to deny. An audited registry migration is required
# before adding a grant. A strict gateway grant can bind the model, upstream,
# privacy settings, high-risk approval threshold, and external verification key:
# strict-provider:
#   max_classification: private
#   approval_required_at: private
#   gateway_required: true
#   gateway_secret_env: GOV_SUBSTRATE_STRICT_PROVIDER_GATEWAY_SECRET
#   request:
#     model: fixed-model
#     upstream: fixed-upstream
#     allow_fallbacks: false
#     data_collection: deny
#     zdr: true
#     retention: none
providers: {}

# Optional automatic containment uses denied attempts only. Enabling it also
# requires circuit_operator_token_env above.
# monitoring:
#   window_seconds: 60
#   actor_denials: 10
#   cross_actor_denials: 3
