name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_phi:
        description: Run the manual official Phi-4 Mini local acceptance leg
        type: boolean
        default: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Policy and control logic (Docker tests remain opt-in)
        run: python -m pytest -q tests --ignore=tests/acceptance

  probe-portability:
    name: Hostile probe (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: wasm32-wasip1
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 '${{ matrix.target }}'
      - name: Compile the same hostile probe source
        shell: bash
        run: >-
          cargo +1.90.0 build --release --locked
          --manifest-path tests/probes/runtime-probe/Cargo.toml
          --target '${{ matrix.target }}'

  runtime-conformance:
    name: Native Ubuntu Docker/containerd conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Record native Docker environment
        run: >-
          python scripts/record_runtime_environment.py --backend docker
          --output "$RUNNER_TEMP/runtime-evidence/docker.json"
      - name: Supervisor conformance (real workers, no model)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real OS attempts, no model)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Circuit force-kill and orphan recovery (real Docker)
        env:
          RUN_DOCKER_TESTS: '1'
        run: python -m pytest -q tests/test_docker_runtime_integration.py
      - name: Upload native Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-docker-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/docker.json
          if-no-files-found: error

  runtime-conformance-podman:
    name: Rootless Podman runtime conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Configure local rootless Podman without Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap fuse-overlayfs slirp4netns passt
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi
          sudo systemctl stop docker.service docker.socket containerd.service
          if docker info >/dev/null 2>&1; then
            echo 'Docker daemon must be unavailable during the Podman run' >&2
            exit 1
          fi
          podman system migrate
          podman info --format json > "$RUNNER_TEMP/podman-info.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/podman-info.json')); assert d['host']['security']['rootless'] is True; assert not d['host'].get('serviceIsRemote', False)"
      - name: Record native rootless Podman environment
        run: >-
          python scripts/record_runtime_environment.py --backend podman
          --output "$RUNNER_TEMP/runtime-evidence/podman.json"
      - name: Supervisor conformance (real rootless workers)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: podman
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real rootless OS attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: podman
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Upload rootless Podman evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-podman-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/podman.json
          if-no-files-found: error

  runtime-conformance-gvisor:
    name: gVisor runsc OCI conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install pinned official gVisor release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gvisor-x86_64.tar.bz2"
          curl -fsSLo "$archive" \
            https://github.com/google/gvisor/releases/download/release-20260921.0/gvisor-x86_64.tar.bz2
          echo "3dd478770dd751d09c257ba14d739b179348a36c5f2d9e954b773f5f90bff646  $archive" | sha256sum -c -
          sudo tar -xjf "$archive" -C /usr/local/bin
          rm -f "$archive"
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          runsc --version
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Record gVisor environment
        run: >-
          python scripts/record_runtime_environment.py --backend gvisor
          --output "$RUNNER_TEMP/runtime-evidence/gvisor.json"
      - name: Supervisor conformance (real gVisor workers)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: gvisor
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real gVisor OS attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: gvisor
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Upload gVisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-gvisor-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/gvisor.json
          if-no-files-found: error

  runtime-conformance-wasmtime:
    name: Wasmtime/WASI runtime conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Build the fixed hostile probe for WASI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 wasm32-wasip1
          cargo +1.90.0 build --release --locked \
            --manifest-path tests/probes/runtime-probe/Cargo.toml \
            --target wasm32-wasip1
          echo "WASMTIME_MODULE=$GITHUB_WORKSPACE/tests/probes/runtime-probe/target/wasm32-wasip1/release/gov-runtime-probe.wasm" >> "$GITHUB_ENV"
      - name: Install pinned official Wasmtime release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasmtime-v49.0.1-x86_64-linux.tar.xz"
          curl -fsSLo "$archive" \
            https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.1/wasmtime-v49.0.1-x86_64-linux.tar.xz
          echo "c71f7e0d30a92e418f0d17db7c6d8f6664c1ad764340a1278678f4209deab534  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "WASMTIME_BIN=$RUNNER_TEMP/wasmtime-v49.0.1-x86_64-linux/wasmtime" >> "$GITHUB_ENV"
      - name: Record Wasmtime environment
        run: >-
          python scripts/record_runtime_environment.py --backend wasmtime
          --wasmtime-bin "$WASMTIME_BIN" --wasmtime-module "$WASMTIME_MODULE"
          --output "$RUNNER_TEMP/runtime-evidence/wasmtime.json"
      - name: Supervisor conformance (real WASI instances)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: wasmtime
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real WASI attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: wasmtime
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Upload Wasmtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-wasmtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/wasmtime.json
          if-no-files-found: error

  runtime-conformance-native-linux:
    name: Native Linux supervisor conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Build the native Linux launcher and fixed hostile probe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev musl-tools
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 x86_64-unknown-linux-musl
          cargo +1.90.0 build --release --locked \
            --manifest-path tests/probes/runtime-probe/Cargo.toml \
            --target x86_64-unknown-linux-musl
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            deploy/native/linux_sandbox.c -lseccomp \
            -o "$RUNNER_TEMP/native-linux-launcher"
          echo "NATIVE_LINUX_LAUNCHER=$RUNNER_TEMP/native-linux-launcher" >> "$GITHUB_ENV"
          echo "NATIVE_PROBE=$GITHUB_WORKSPACE/tests/probes/runtime-probe/target/x86_64-unknown-linux-musl/release/gov-runtime-probe" >> "$GITHUB_ENV"
      - name: Create an explicit delegated cgroup v2 root
        shell: bash
        run: |
          set -euo pipefail
          root="/sys/fs/cgroup/gov-substrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$root"
          echo "NATIVE_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Record native Linux environment
        run: >-
          python scripts/record_runtime_environment.py --backend native-linux
          --native-launcher "$NATIVE_LINUX_LAUNCHER"
          --native-worker "$NATIVE_PROBE" --cgroup-root "$NATIVE_CGROUP_ROOT"
          --output "$RUNNER_TEMP/runtime-evidence/native-linux.json"
      - name: Supervisor conformance (real native Linux workers)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: native-linux
        run: >-
          sudo --preserve-env=RUN_ACCEPTANCE_TESTS,RUNTIME_CONFORMANCE_BACKEND,NATIVE_LINUX_LAUNCHER,NATIVE_PROBE,NATIVE_CGROUP_ROOT
          "$(command -v python)" -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real native Linux attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: native-linux
        run: >-
          sudo --preserve-env=RUN_ACCEPTANCE_TESTS,RUNTIME_CONFORMANCE_BACKEND,NATIVE_LINUX_LAUNCHER,NATIVE_PROBE,NATIVE_CGROUP_ROOT
          "$(command -v python)" -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Remove delegated cgroup root
        if: always()
        shell: bash
        run: |
          if [[ -n "${NATIVE_CGROUP_ROOT:-}" && -d "$NATIVE_CGROUP_ROOT" ]]; then
            sudo rmdir "$NATIVE_CGROUP_ROOT" || true
          fi
      - name: Upload native Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-native-linux-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/native-linux.json
          if-no-files-found: error

  runtime-conformance-native-windows:
    name: Native Windows supervisor conformance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Build the fixed hostile probe for Windows
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 x86_64-pc-windows-msvc
          cargo +1.90.0 build --release --locked \
            --manifest-path tests/probes/runtime-probe/Cargo.toml \
            --target x86_64-pc-windows-msvc
          echo "NATIVE_PROBE=$GITHUB_WORKSPACE/tests/probes/runtime-probe/target/x86_64-pc-windows-msvc/release/gov-runtime-probe.exe" >> "$GITHUB_ENV"
      - name: Record native Windows environment
        run: >-
          python scripts/record_runtime_environment.py --backend native-windows
          --native-worker "$env:NATIVE_PROBE"
          --output "$env:RUNNER_TEMP/runtime-evidence/native-windows.json"
      - name: Supervisor conformance (real native Windows workers)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: native-windows
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real native Windows attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: native-windows
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-native-windows-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/native-windows.json
          if-no-files-found: error

  runtime-conformance-kubernetes:
    name: Kubernetes/Calico runtime conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install pinned kind and kubectl releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Create pinned disposable cluster with Calico policy enforcement
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          nodes:
            - role: control-plane
            - role: worker
          EOF
          kind create cluster --name gov-substrate \
            --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed \
            --config "$RUNNER_TEMP/kind.yaml" --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          echo "KUBERNETES_CONTEXT=kind-gov-substrate" >> "$GITHUB_ENV"
          echo "KUBERNETES_NAMESPACE=gov-substrate-conformance" >> "$GITHUB_ENV"
          curl -fsSLo "$RUNNER_TEMP/calico.yaml" \
            https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml
          echo "a8c828a06a87c629a282ebbc424895b77f3a030251993e41ea400a743675bb02  $RUNNER_TEMP/calico.yaml" | sha256sum -c -
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl apply -f "$RUNNER_TEMP/calico.yaml"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl \
            --namespace kube-system rollout status daemonset/calico-node --timeout=8m
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl \
            --namespace kube-system rollout status deployment/calico-kube-controllers --timeout=8m
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl wait \
            --for=condition=Ready nodes --all --timeout=8m
      - name: Build and load the immutable hostile-probe image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/docker/Dockerfile.conformance \
            --tag gov-substrate-runtime-probe:kubernetes .
          kind load docker-image --name gov-substrate \
            gov-substrate-runtime-probe:kubernetes
          ref=docker.io/library/gov-substrate-runtime-probe:kubernetes
          digest=$(docker exec gov-substrate-worker ctr --namespace k8s.io \
            images list | awk -v ref="$ref" '$1 == ref {print $3}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_ref="docker.io/library/gov-substrate-runtime-probe@${digest}"
          while read -r node; do
            docker exec "$node" ctr --namespace k8s.io images tag \
              "$ref" "$immutable_ref"
          done < <(kind get nodes --name gov-substrate)
          echo "KUBERNETES_PROBE_IMAGE=${immutable_ref}" >> "$GITHUB_ENV"
      - name: Build and load the Phase 9 package-mirror fixture
        shell: bash
        run: |
          set -euo pipefail
          image="gov-substrate-phase9:kubernetes"
          docker build --file deploy/docker/Dockerfile.phase9 --tag "$image" .
          kind load docker-image --name gov-substrate "$image"
          ref="docker.io/library/$image"
          digest=$(docker exec gov-substrate-worker ctr --namespace k8s.io \
            images list | awk -v ref="$ref" '$1 == ref {print $3}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_ref="docker.io/library/gov-substrate-phase9@${digest}"
          while read -r node; do
            docker exec "$node" ctr --namespace k8s.io images tag \
              "$ref" "$immutable_ref"
          done < <(kind get nodes --name gov-substrate)
          echo "KUBERNETES_PHASE9_IMAGE=${immutable_ref}" >> "$GITHUB_ENV"
      - name: Create restricted default-deny worker namespace
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "$KUBERNETES_NAMESPACE"
          kubectl label namespace "$KUBERNETES_NAMESPACE" \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=v1.36 \
            pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/warn=restricted
          kubectl --namespace "$KUBERNETES_NAMESPACE" apply -f - <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: gov-substrate-default-deny
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
          EOF
      - name: Record Kubernetes environment
        run: >-
          python scripts/record_runtime_environment.py --backend kubernetes
          --kube-namespace "$KUBERNETES_NAMESPACE"
          --probe-image "$KUBERNETES_PROBE_IMAGE"
          --output "$RUNNER_TEMP/runtime-evidence/kubernetes.json"
      - name: Supervisor conformance (real Kubernetes Pods)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: kubernetes
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real Kubernetes/Calico attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: kubernetes
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-kubernetes-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence/kubernetes.json
          if-no-files-found: error
      - name: Remove disposable Kubernetes cluster
        if: always()
        shell: bash
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name gov-substrate || true
          fi
          docker image rm gov-substrate-runtime-probe:kubernetes || true
          docker image rm gov-substrate-phase9:kubernetes || true

  runtime-conformance-openshell:
    name: NVIDIA OpenShell Docker conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install pinned official OpenShell release
        shell: bash
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/openshell_0.1.2_amd64.deb"
          curl -fsSLo "$deb" \
            https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2/openshell_0.1.2-1_amd64.deb
          echo "1f5416ea08f32fdc621f20a2cc0324298e60aba8bbe996459d9e3b44195f23df  $deb" | sha256sum -c -
          sudo apt-get install -y "$deb"
          openshell --version | grep -Fx 'openshell 0.1.2'
          openshell-gateway --version | grep -Fx 'openshell-gateway 0.1.2'
      - name: Start authenticated OpenShell Docker gateway
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq socat
          root="$RUNNER_TEMP/openshell"
          mkdir -p "$root" "$HOME/.config/openshell/gateways/phase5/mtls"
          openshell-gateway generate-certs --output-dir "$root/tls" \
            --server-san host.openshell.internal >/dev/null
          cp "$root/tls/ca.crt" "$HOME/.config/openshell/gateways/phase5/mtls/ca.crt"
          cp "$root/tls/client/tls.crt" "$HOME/.config/openshell/gateways/phase5/mtls/tls.crt"
          cp "$root/tls/client/tls.key" "$HOME/.config/openshell/gateways/phase5/mtls/tls.key"
          cat > "$root/gateway.toml" <<EOF
          [openshell]
          version = 2

          [openshell.gateway]
          compute_driver = "docker"
          guest_tls_ca = "$root/tls/ca.crt"
          guest_tls_cert = "$root/tls/client/tls.crt"
          guest_tls_key = "$root/tls/client/tls.key"

          [openshell.gateway.tls]
          cert_path = "$root/tls/server/tls.crt"
          key_path = "$root/tls/server/tls.key"
          client_ca_path = "$root/tls/ca.crt"

          [openshell.gateway.mtls_auth]
          enabled = true

          [openshell.gateway.gateway_jwt]
          signing_key_path = "$root/tls/jwt/signing.pem"
          public_key_path = "$root/tls/jwt/public.pem"
          kid_path = "$root/tls/jwt/kid"
          gateway_id = "gov-substrate-phase5"
          ttl_secs = 3600
          EOF
          nohup env OPENSHELL_GRPC_ENDPOINT=https://host.openshell.internal:18671 \
            OPENSHELL_DOCKER_TLS_CA="$root/tls/ca.crt" \
            OPENSHELL_DOCKER_TLS_CERT="$root/tls/client/tls.crt" \
            OPENSHELL_DOCKER_TLS_KEY="$root/tls/client/tls.key" \
            openshell-gateway --name gov-substrate-phase5 \
            --bind-address 127.0.0.1 --port 18670 \
            --db-url "sqlite:$root/gateway.db" --config "$root/gateway.toml" \
            >"$root/gateway.log" 2>&1 &
          echo $! > "$root/gateway.pid"
          for _ in $(seq 1 90); do
            if nc -z 127.0.0.1 18670; then break; fi
            if ! kill -0 "$(cat "$root/gateway.pid")" 2>/dev/null; then
              cat "$root/gateway.log"
              exit 1
            fi
            sleep 1
          done
          bridge_ip="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          nohup socat "TCP-LISTEN:18671,bind=$bridge_ip,reuseaddr,fork" \
            TCP:127.0.0.1:18670 >"$root/bridge-proxy.log" 2>&1 &
          echo $! > "$root/bridge-proxy.pid"
          openshell gateway remove phase5 >/dev/null 2>&1 || true
          openshell gateway add https://127.0.0.1:18670 --local --name phase5
          openshell gateway select phase5
          openshell status --output json
          echo "OPENSHELL_GATEWAY_NAME=phase5" >> "$GITHUB_ENV"
          echo "OPENSHELL_POLICY=$GITHUB_WORKSPACE/deploy/openshell/policy.yaml" >> "$GITHUB_ENV"
      - name: Build immutable hostile-probe image
        shell: bash
        run: |
          set -euo pipefail
          image="gov-substrate-runtime-probe:openshell-${GITHUB_SHA}"
          docker build --file deploy/docker/Dockerfile.conformance --tag "$image" .
          echo "OPENSHELL_PROBE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Record OpenShell environment
        run: >-
          python scripts/record_runtime_environment.py --backend openshell
          --openshell-gateway "$OPENSHELL_GATEWAY_NAME"
          --openshell-policy "$OPENSHELL_POLICY"
          --probe-image "$OPENSHELL_PROBE_IMAGE"
          --output "$RUNNER_TEMP/runtime-evidence/openshell.json"
      - name: Supervisor conformance (real OpenShell sandboxes)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: openshell
        run: python -m pytest -q tests/acceptance/conformance -m conformance
      - name: Runtime enforcement (real OpenShell sandbox attempts)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
          RUNTIME_CONFORMANCE_BACKEND: openshell
        run: python -m pytest -q tests/acceptance/conformance -m runtime_enforcement
      - name: Upload OpenShell evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-environment-openshell-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-evidence/openshell.json
            ${{ runner.temp }}/openshell/gateway.log
            ${{ runner.temp }}/openshell/bridge-proxy.log
          if-no-files-found: error
      - name: Remove OpenShell test resources
        if: always()
        shell: bash
        run: |
          openshell sandbox list --selector gov.substrate.managed=true \
            --names 2>/dev/null | xargs --no-run-if-empty openshell sandbox delete || true
          if [[ -f "$RUNNER_TEMP/openshell/gateway.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/openshell/gateway.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/openshell/bridge-proxy.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/openshell/bridge-proxy.pid")" 2>/dev/null || true
          fi
          if [[ -n "${OPENSHELL_PROBE_IMAGE:-}" ]]; then
            docker image rm "$OPENSHELL_PROBE_IMAGE" || true
          fi

  acceptance-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Fetch pinned official Qwen Q8_0 artifact and verify SHA-256
        shell: bash
        run: |
          model="$RUNNER_TEMP/Qwen3-0.6B-Q8_0.gguf"
          curl --fail --location --silent --show-error \
            'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/ef4088322893040952513f532f736ddeab518403/Qwen3-0.6B-Q8_0.gguf' \
            --output "$model"
          echo '12fae8b8f78f0360b498d04c8db7d33aff29ab7d8080231f93a17c18119e6735  '"$model" | sha256sum --check --status
          echo "GENERATION_MODEL_BLOB=$model" >> "$GITHUB_ENV"
      - name: Qwen local-model acceptance (real Docker and substrate)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: >-
          python -m pytest -q tests/acceptance/test_local_runtime.py
          tests/acceptance/test_network_scope.py
      - name: Environment isolation probes (separate runtime evidence)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: python -m pytest -q tests/acceptance/environment

  incident-escape-acceptance:
    name: Incident-derived escape acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Real networkless agent and reachable delegated services
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: python -m pytest -q tests/acceptance/incidents
      - name: Real mTLS provider gateway and independent witness
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: python -m pytest -q tests/acceptance/phase9

  acceptance-phi:
    if: github.event_name == 'workflow_dispatch' && inputs.run_phi
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -e '.[test]'
      - name: Fetch pinned official llama.cpp converter and requirements
        shell: bash
        run: |
          set -euo pipefail
          commit=4df29be4f4c3673f428170fda944a5b19f743bb8
          curl --fail --location --retry 3 --silent --show-error \
            "https://codeload.github.com/ggml-org/llama.cpp/zip/$commit" \
            --output "$RUNNER_TEMP/llama.cpp.zip"
          unzip -q "$RUNNER_TEMP/llama.cpp.zip" -d "$RUNNER_TEMP"
          python -m pip install --no-cache-dir \
            -r "$RUNNER_TEMP/llama.cpp-$commit/requirements/requirements-convert_hf_to_gguf.txt"
      - name: Fetch and verify official Microsoft Phi-4 Mini weights
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/.pytest_tmp_phi4mini"
          mkdir -p "$source_dir"
          base=https://huggingface.co/microsoft/Phi-4-mini-instruct/resolve/cfbefacb99257ffa30c83adab238a50856ac3083
          for file in LICENSE README.md config.json generation_config.json \
            added_tokens.json special_tokens_map.json tokenizer_config.json \
            tokenizer.json merges.txt vocab.json model.safetensors.index.json \
            model-00001-of-00002.safetensors model-00002-of-00002.safetensors; do
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
              "$base/$file" --output "$source_dir/$file"
          done
          printf '%s  %s\n' \
            bc703090b63eda16f639fa4de7ac54635c23105ab1da2f6ec4d3403151d38ee6 "$source_dir/model-00001-of-00002.safetensors" \
            7ff79b9d2d31076bac2663393451f6530f4fc8ca49b09002116c92c373dba983 "$source_dir/model-00002-of-00002.safetensors" \
            382cc235b56c725945e149cc25f191da667c836655efd0857b004320e90e91ea "$source_dir/tokenizer.json" \
            | sha256sum --check --status
          echo "PHI_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Convert official Phi weights to Q8_0 GGUF
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/Phi-4-mini-instruct-Q8_0.gguf"
          python "$RUNNER_TEMP/llama.cpp-4df29be4f4c3673f428170fda944a5b19f743bb8/convert_hf_to_gguf.py" \
            "$PHI_SOURCE_DIR" --outtype q8_0 --outfile "$model"
          echo '3e81a3ad900b6d67df011d42ef14bad63354a3516fbd229b9bf29755363b25ee  '"$model" | sha256sum --check --status
          echo "GENERATION_MODEL_BLOB=$model" >> "$GITHUB_ENV"
          rm "$PHI_SOURCE_DIR/model-00001-of-00002.safetensors" "$PHI_SOURCE_DIR/model-00002-of-00002.safetensors"
      - name: Phi local-model acceptance (same real Docker tests)
        env:
          RUN_ACCEPTANCE_TESTS: '1'
        run: >-
          python -m pytest -q tests/acceptance/test_local_runtime.py
          tests/acceptance/test_network_scope.py
